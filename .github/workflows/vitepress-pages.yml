name: Build and Deploy VitePress Docs

on:
  push:
    branches:
      - main
    paths:
      - '.vitepress/**'
      - 'zh/**'
      - 'package.json'
      - '.github/workflows/vitepress-pages.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Build VitePress site
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name == 'monopoly3d-docs' && '/monopoly3d-docs/' || '/' }}
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          cp -r .vitepress/dist/* .
          git -c user.email="hermes@yluo.me" -c user.name="Hermes Agent" \
            commit --allow-empty -m "deploy: $(git rev-parse --short HEAD)"
          git push origin main:main